<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Ordonnances</title>
    <link rel="stylesheet" href="ordonance.css" />
    <link rel="stylesheet" href="footer.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header-bg"></div>
      <div class="wave-container"></div>
      <div class="header-content">
        <div class="logo-container">
          <img src="logo.png" alt="PillCare Logo" class="logo-img" />
        </div>
        <nav class="top-nav">
          <a href="index.html" class="nav-item" data-page="home">Accueil</a>
          <a href="Medicament.html" class="nav-item" data-page="Medicament"
            >Medicaments</a
          >
          <a href="calendrier.html" class="nav-item" data-page="calendar"
            >Calendrier</a
          >
          <a href="ordonance.html" class="nav-item active" data-page="ordonance"
            >ordonance</a
          >
          <a href="profile.html" class="nav-item" data-page="profile"
            >profile</a
          >
        </nav>
        <div class="user-menu">
          <button id="user-btn"><i class="fas fa-user-circle"></i></button>
          <div class="dropdown-menu">
            <a href="settings.html"><i class="fas fa-cog"></i> Paramètres</a>
            <a href="#" class="theme-toggle" onclick="toggleTheme()"
              ><i class="fas fa-moon"></i> Thème</a
            >
            <a href="#" id="logout-btn"
              ><i class="fas fa-sign-out-alt"></i> Déconnexion</a
            >
          </div>
        </div>
        <button class="mobile-menu-btn">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <div class="container">
      <div class="ordonnance-section">
        <h2>Ajouter une nouvelle ordonnance</h2>
        <div id="alertMessage"></div>

        <form
          id="ordonnanceForm"
          class="ordonnance-form"
          enctype="multipart/form-data"
        >
          <div class="form-group">
            <label for="titre">Titre de l'ordonnance</label>
            <input type="text" id="titre" name="titre" required />
          </div>

          <div class="form-group">
            <label for="date">Date de l'ordonnance</label>
            <input type="date" id="date" name="date" required />
          </div>

          <div class="form-group">
            <label for="medecin">Nom du médecin</label>
            <input type="text" id="medecin" name="medecin" required />
          </div>

          <div class="form-group">
            <label for="description">Description (optionnelle)</label>
            <textarea id="description" name="description" rows="3"></textarea>
          </div>

          <div class="form-group">
            <label for="fichier">Fichier de l'ordonnance (PDF, JPG, PNG)</label>
            <input
              type="file"
              id="fichier"
              name="fichier"
              accept=".pdf,.jpg,.jpeg,.png"
              required
            />
            <div id="filePreview" class="file-preview"></div>
          </div>

          <button type="submit" class="btn">Enregistrer l'ordonnance</button>
        </form>
      </div>

      <div class="ordonnance-section">
        <h2>Mes ordonnances</h2>
        <div id="ordonnancesList" class="ordonnance-list">
          <!-- La liste des ordonnances sera chargée dynamiquement -->
        </div>
      </div>
    </div>

    <footer>
      <div class="container">
        <div class="footer-content">
          <div class="footer-logo">
            <img src="logo.png" alt="PillCare Logo" />
          </div>
          <div class="footer-links">
            <h3>Liens rapides</h3>
            <ul>
              <li><a href="index.html">Accueil</a></li>
              <li><a href="about.html">À propos</a></li>
              <li><a href="contact.html">Contact</a></li>
              <li><a href="privacy.html">Confidentialité</a></li>
            </ul>
          </div>
          <div class="footer-contact">
            <h3>Contact</h3>
            <p><i class="fas fa-envelope"></i> contact@pillcare.com</p>
            <p><i class="fas fa-phone"></i> +33 1 23 45 67 89</p>
            <div class="social-icons">
              <a href="#"><i class="fab fa-facebook"></i></a>
              <a href="#"><i class="fab fa-twitter"></i></a>
              <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
          </div>
        </div>
        <div class="footer-bottom">
          <p>&copy; 2025 PillCare. Tous droits réservés.</p>
        </div>
      </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Prévisualisation du fichier
        document
          .getElementById("fichier")
          .addEventListener("change", function (e) {
            const filePreview = document.getElementById("filePreview");
            filePreview.innerHTML = "";

            const file = e.target.files[0];
            if (!file) return;

            if (file.type.startsWith("image/")) {
              const img = document.createElement("img");
              img.src = URL.createObjectURL(file);
              img.style.maxHeight = "200px";
              filePreview.appendChild(img);
            } else if (file.type === "application/pdf") {
              const pdfInfo = document.createElement("div");
              pdfInfo.textContent = `PDF: ${file.name} (${Math.round(
                file.size / 1024
              )} KB)`;
              filePreview.appendChild(pdfInfo);
            }
          });

        // Gestionnaire de soumission du formulaire
        document
          .getElementById("ordonnanceForm")
          .addEventListener("submit", function (e) {
            e.preventDefault();

            // Créer un objet FormData pour envoyer les données et les fichiers
            const formData = new FormData(this);

            // Envoyer les données au serveur
            fetch("save_ordonnance.php", {
              method: "POST",
              body: formData,
            })
              .then((response) => response.json())
              .then((data) => {
                if (data.success) {
                  showAlert("Ordonnance enregistrée avec succès!", "success");
                  document.getElementById("ordonnanceForm").reset();
                  document.getElementById("filePreview").innerHTML = "";
                  loadOrdonnances(); // Recharger la liste des ordonnances
                } else {
                  showAlert("Erreur: " + data.message, "error");
                }
              })
              .catch((error) => {
                showAlert("Erreur de connexion au serveur", "error");
                console.error("Erreur:", error);
              });
          });

        // Fonction pour afficher les alertes
        function showAlert(message, type) {
          const alertDiv = document.getElementById("alertMessage");
          alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;

          // Faire disparaître l'alerte après 5 secondes
          setTimeout(() => {
            alertDiv.innerHTML = "";
          }, 5000);
        }

        // Fonction pour charger la liste des ordonnances
        function loadOrdonnances() {
          fetch("get_ordonnances.php")
            .then((response) => response.json())
            .then((data) => {
              const ordonnancesList =
                document.getElementById("ordonnancesList");
              ordonnancesList.innerHTML = "";

              if (data.length === 0) {
                ordonnancesList.innerHTML =
                  "<p>Vous n'avez pas encore d'ordonnances enregistrées.</p>";
                return;
              }

              data.forEach((ordonnance) => {
                ordonnancesList.innerHTML += `
                            <div class="ordonnance-item">
                                <div class="ordonnance-info">
                                    <h3>${ordonnance.titre}</h3>
                                    <p>Date: ${ordonnance.date}</p>
                                    <p>Médecin: ${ordonnance.medecin}</p>
                                </div>
                                <div class="ordonnance-actions">
                                    <a href="view_ordonnance.php?id=${ordonnance.id}" class="btn btn-sm btn-view" target="_blank">Voir</a>
                                    <button class="btn btn-sm btn-delete" data-id="${ordonnance.id}">Supprimer</button>
                                </div>
                            </div>
                        `;
              });

              // Ajouter les gestionnaires d'événements pour les boutons de suppression
              document.querySelectorAll(".btn-delete").forEach((button) => {
                button.addEventListener("click", function () {
                  const id = this.getAttribute("data-id");
                  deleteOrdonnance(id);
                });
              });
            })
            .catch((error) => {
              console.error(
                "Erreur lors du chargement des ordonnances:",
                error
              );
            });
        }

        // Fonction pour supprimer une ordonnance
        function deleteOrdonnance(id) {
          if (confirm("Êtes-vous sûr de vouloir supprimer cette ordonnance?")) {
            fetch("delete_ordonnance.php", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ id: id }),
            })
              .then((response) => response.json())
              .then((data) => {
                if (data.success) {
                  showAlert("Ordonnance supprimée avec succès!", "success");
                  loadOrdonnances(); // Recharger la liste des ordonnances
                } else {
                  showAlert("Erreur: " + data.message, "error");
                }
              })
              .catch((error) => {
                showAlert("Erreur de connexion au serveur", "error");
                console.error("Erreur:", error);
              });
          }
        }

        // Charger la liste des ordonnances au chargement de la page
        loadOrdonnances();
      });
    </script>
  </body>
</html>
